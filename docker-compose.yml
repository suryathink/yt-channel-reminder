# Production setup for a droplet that already runs Nginx.
# The containers only listen on 127.0.0.1; Nginx (with a Certbot certificate) is the public entry.
# See deploy/nginx/yt-reminder.conf. The database is MongoDB Atlas.
#
#   cp .env.example .env               # optional: change host ports
#   cp server/.env.example server/.env # MONGODB_URI, APP_SECRET, RESEND_API_KEY, ...
#   docker compose up -d --build

services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      PORT: "4000"
      DISABLE_SCHEDULER: "0"   # the built-in scheduler sends the emails
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Container-to-container address. Only used if a request reaches Next.js at /api;
        # normally Nginx sends /api straight to the server.
        BACKEND_URL: http://server:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - server
