# Production setup for a single server (e.g. a DigitalOcean droplet).
# The database is MongoDB Atlas, so nothing here stores data except Caddy's certificates.
#
#   cp .env.example .env               # set DOMAIN
#   cp server/.env.example server/.env # set MONGODB_URI, APP_SECRET, RESEND_API_KEY, ...
#   docker compose up -d --build

services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      PORT: "4000"
      DISABLE_SCHEDULER: "0"   # the built-in scheduler sends the emails
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://server:4000
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web
      - server

volumes:
  caddy_data:
  caddy_config:
