# Nginx site for YT Reminder.
#   sudo cp deploy/nginx/yt-reminder.conf /etc/nginx/sites-available/yt-reminder
#   sudo sed -i 's/reminder.example.com/YOUR.DOMAIN/' /etc/nginx/sites-available/yt-reminder
#   sudo ln -s /etc/nginx/sites-available/yt-reminder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN      # adds HTTPS + redirect, renews automatically
#
# Ports must match CLIENT_PORT / API_PORT in the root .env (defaults 3000 / 4000).

server {
    listen 80;
    listen [::]:80;
    server_name reminder.example.com;

    # Express API (also handles the Google OAuth callback and /api/cron)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Adding a big channel imports its whole video list, which can take a while.
        proxy_read_timeout 120s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
