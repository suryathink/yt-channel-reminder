name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Client typecheck and build
        working-directory: client
        run: |
          npm ci
          npm run typecheck
          npm run build

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Checked first, so nothing is built or pushed until the deploy is fully configured.
      - name: Check required secrets and variables
        env:
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          missing=""
          for name in DOCKER_USERNAME DOCKER_PASSWORD DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY MONGODB_URI RESEND_API_KEY YOUTUBE_API_KEY CERTBOT_EMAIL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in Settings → Secrets and variables → Actions:$missing (CERTBOT_EMAIL is a Variable, the rest are Secrets)"
            exit 1
          fi

      - uses: actions/checkout@v4

      # Image names include the Docker Hub username, which is a secret, so GitHub won't pass them
      # between jobs as outputs. Each job derives them the same way: <user>/yt-reminder-<part>:<commit>.
      - name: Image names
        id: names
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          echo "server=$DOCKER_USERNAME/yt-reminder-server:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "client=$DOCKER_USERNAME/yt-reminder-client:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.names.outputs.server }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: BACKEND_URL=http://server:4000
          tags: ${{ steps.names.outputs.client }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Non-secret settings: Settings → Secrets and variables → Actions → Variables.
      DOMAIN: ${{ vars.DOMAIN || 'ytreminder.suryathink.com' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM || 'YT Reminder <reminders@suryathink.com>' }}
      CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
      APP_DIR: yt-reminder # relative to the SSH user's home directory
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT || '22' }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DROPLET_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DROPLET_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DROPLET_SSH_PORT" -H "$DROPLET_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<CONFIG
          Host droplet
            HostName $DROPLET_HOST
            User $DROPLET_USER
            Port $DROPLET_SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CONFIG

      - name: Build server/.env from secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          umask 077
          {
            echo "WEB_URL=https://$DOMAIN"
            echo "MONGODB_URI=$MONGODB_URI"
            echo "MONGODB_DB=yt_reminder"
            echo "RESEND_API_KEY=$RESEND_API_KEY"
            echo "EMAIL_FROM=$EMAIL_FROM"
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "CRON_SECRET=$CRON_SECRET"
            echo "DEFAULT_TIMEZONE=Asia/Kolkata"
            echo "DEFAULT_SEND_TIMES=10:00,20:00"
            echo "MIN_VIDEO_SECONDS=180"
            echo "DISABLE_SCHEDULER=0"
          } > server.env

      - name: Copy code to the droplet
        run: |
          # shellcheck disable=SC2029 # $APP_DIR is meant to expand here, on the runner
          ssh droplet "command -v rsync >/dev/null || { S=; [ \$(id -u) -ne 0 ] && S='sudo -n'; \$S apt-get update -qq && \$S apt-get install -y -qq rsync; }; mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .next \
            --exclude /.env --exclude /.deploy.env --exclude /server/.env --exclude /server.env \
            ./ "droplet:$APP_DIR/"
          scp -q server.env "droplet:$APP_DIR/server/.env.new"
          rm -f server.env

      - name: Log the droplet in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          # Needed if the images are private. The password goes over stdin, never on a command line.
          # shellcheck disable=SC2029 # $DOCKER_USERNAME is meant to expand here, on the runner
          printf '%s' "$DOCKER_PASSWORD" | ssh droplet \
            "S=; docker info >/dev/null 2>&1 || S='sudo -n'; \$S docker login -u '$DOCKER_USERNAME' --password-stdin >/dev/null"

      - name: Deploy on the droplet
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          SERVER_IMAGE="$DOCKER_USERNAME/yt-reminder-server:$GITHUB_SHA"
          CLIENT_IMAGE="$DOCKER_USERNAME/yt-reminder-client:$GITHUB_SHA"
          # shellcheck disable=SC2029 # values are meant to expand here, on the runner
          ssh droplet "cd $APP_DIR && DOMAIN='$DOMAIN' CERTBOT_EMAIL='$CERTBOT_EMAIL' SERVER_IMAGE='$SERVER_IMAGE' CLIENT_IMAGE='$CLIENT_IMAGE' bash deploy/remote-deploy.sh"

      - name: Check the live site
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://$DOMAIN/api/health"
          echo
          echo "Live at https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
